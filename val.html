<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine 💖</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ffd6e0, #ffeef3);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
      max-width: 90%;
    }

    h1 {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 700;
      color: #d6336c;
      margin-bottom: 50px;
      line-height: 1.2;
    }

    .buttons {
      position: relative;
      height: 100px;
    }

    button {
      font-size: 1.2rem;
      padding: 14px 40px;
      border-radius: 40px;
      border: none;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #yesBtn {
      background-color: #ff4d88;
      color: white;
    }

    #yesBtn:hover {
      transform: scale(1.05);
    }

    #noBtn {
      background-color: #e0e0e0;
      color: #555;
      position: absolute;
      left: 55%;
      top: 0;
    }

    #gif {
      display: none;
      margin-top: 40px;
    }

    #gif img {
      width: 280px;
      border-radius: 20px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Will you be my Valentine? 💖</h1>

    <div class="buttons">
      <button id="yesBtn" onclick="yesClicked()">Yes 💕</button>
      <button id="noBtn" onmouseenter="moveNo()">No 🙃</button>
    </div>

    <div id="gif">
     <h2>Hehe… knew you couldn’t say no 😌💘</h2>

   <img src="https://media.giphy.com/media/26u4cqiYI30juCOGY/giphy.gif">



    </div>
  </div>

  <script>
    function moveNo() {
      const btn = document.getElementById("noBtn");
      const x = Math.random() * (window.innerWidth - btn.offsetWidth);
      const y = Math.random() * (window.innerHeight - btn.offsetHeight);
      btn.style.left = x + "px";
      btn.style.top = y + "px";
    }

    function yesClicked() {
      document.querySelector(".buttons").style.display = "none";
      document.getElementById("gif").style.display = "block";
    }
  </script>

</body>
</html>
